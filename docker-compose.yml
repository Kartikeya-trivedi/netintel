services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/netintel.db
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
    volumes:
      - netintel-data:/data

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  netintel-data:
