[project]
name = "netintel-backend"
version = "0.1.0"
description = "NetIntel — AI-powered criminal network analysis and intelligence platform (backend API)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Persistence
    "sqlalchemy>=2.0",
    # NLP / extraction
    "spacy>=3.8",
    # The model is a real dependency, not a setup step. Installed ad hoc it sits
    # outside the lockfile, and the next `uv sync` silently removes it: NER then
    # returns nothing and every graph, count, and alert quietly degrades.
    "en-core-web-lg",
    "rapidfuzz>=3.10",
    # Document parsing
    "pypdf>=5.1",
    "python-docx>=1.1",
    # Graph + analytics
    "networkx>=3.4",
    # Anomaly detection
    "pandas>=2.2",
    "scikit-learn>=1.5",
    # Optional LLM extraction (feature-flagged via USE_LLM_EXTRACTION)
    "anthropic>=0.40",
    # Ed25519 signatures on exported finding packages. An established library,
    # never hand-rolled primitives.
    "cryptography>=43",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are designed to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
