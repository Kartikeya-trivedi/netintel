<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ad3d21" />
    <meta
      name="description"
      content="Connect case files, trace relationships to original evidence, and test what each finding depends on. Explore the NetIntel investigation workspace with synthetic demo data."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NetIntel — Criminal Network Intelligence</title>
  </head>
  <body>
    <script>
      // Runs before the bundle so the page never paints the wrong ground.
      // Mirrors applyToDocument() in src/lib/theme.ts.
      try {
        var t = localStorage.getItem('netintel.theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {
        /* blocked storage: fall back to prefers-color-scheme */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
